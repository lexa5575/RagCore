database:
  collection_name: universal_docs
  path: ./chroma_storage
llm:
  provider: lm_studio
  api_url: http://127.0.0.1:1234/v1/completions
  model_name: meta-llama-3.1-8b-instruct
  max_tokens: 800
  temperature: 0.2
  stop:
  - <|eot_id|>
  - <|end_of_text|>
  - 'Human:'
  - 'User:'
server:
  host: 0.0.0.0
  port: 8000
frameworks:
  tailwindcss:
    name: Tailwind CSS
    description: Tailwind CSS Documentation
    path: ./documentation/tailwindcss_docs
    type: markdown
    enabled: true
  vue:
    name: Vue.js
    description: Vue.js Documentation
    path: ./documentation/vue_docs
    type: markdown
    enabled: true
  alpine:
    name: Alpine.js
    description: Alpine.js Documentation
    path: ./documentation/alpine_docs
    type: markdown
    enabled: true
  filament:
    name: Filament
    description: Filament Documentation
    path: ./documentation/filament_docs
    type: markdown
    enabled: true
  laravel:
    name: Laravel
    description: Laravel Documentation
    path: ./documentation/laravel_docs
    type: markdown
    enabled: true
logging:
  level: INFO
  file: ./logs/rag_system.log
cache:
  enabled: true
  ttl: 3600
embeddings:
  model: all-MiniLM-L6-v2
